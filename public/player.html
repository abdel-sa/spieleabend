<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0f2e">
<title>Spieleabend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
/* Handy: Kopfzeile mit Name und Teamfarbe, darunter eine Karte je Spielphase */
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{display:flex;align-items:center;gap:10px;min-height:34px}
.head .me{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head .team{margin-left:auto}
.head .conn{font-size:12px;font-weight:800;color:var(--bad)}
.card{background:var(--panel);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;border:2px solid var(--line);border-top:8px solid var(--c,var(--line));
  box-shadow:0 18px 40px rgb(20 3 22 / .45)}
.title{font:900 30px/1 var(--display);letter-spacing:-.04em;margin:0;align-self:flex-start;color:var(--ink);background:var(--gold);padding:10px 14px 12px;border-radius:14px;transform:rotate(-2deg);
  box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 45%,var(--ink))}
.title span{color:inherit}
.q{font:700 22px/1.3 var(--body);margin:0;text-wrap:balance}
.eyebrow{font:700 14px var(--body);color:var(--muted);margin:0}
.wait{color:var(--muted);font-weight:600;font-size:17px;margin:0;line-height:1.45}
.field{display:flex;align-items:center;border:2px solid var(--c,var(--line));border-radius:var(--r-ctl);background:var(--ink);min-width:0}
.field input{flex:1;min-width:0;border:0;background:transparent;font:800 28px/1 var(--display);letter-spacing:-.02em;padding:14px 14px}
.field input:focus{outline:none}
.field:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.field .unit{padding-right:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.text{width:100%;font:700 20px var(--body);padding:14px 15px;border-radius:var(--r-ctl);border:2px solid var(--c,var(--line));background:var(--ink)}
.text::placeholder,.field input::placeholder{color:#a77fac}
#code{font:800 24px var(--display);letter-spacing:.14em;text-transform:uppercase}
#code::placeholder{letter-spacing:.02em;font:600 20px var(--body);text-transform:none}
.bigteam{font:900 38px/1 var(--display);letter-spacing:-.04em;color:var(--c);margin:0}
.mates{display:flex;flex-wrap:wrap;gap:6px}
/* Buzzer: das größte Ding auf dem Handy */
.buzz{width:min(72vw,280px);aspect-ratio:1;border-radius:50%;border:6px solid var(--ink);background:radial-gradient(circle at 35% 28%,#ff9a8c,#ff4b3e 55%,#c42119);
  color:#fff;font:900 40px var(--display);letter-spacing:-.03em;text-shadow:0 2px 0 rgb(0 0 0 / .25);
  box-shadow:0 12px 0 #7d140e,0 22px 40px rgb(20 3 22 / .6),inset 0 6px 0 rgb(255 255 255 / .35);margin:8px auto 18px;transition:transform .08s,box-shadow .08s}
.buzz:active{transform:translateY(10px);box-shadow:0 2px 0 #7d140e,0 6px 14px rgb(20 3 22 / .5),inset 0 6px 0 rgb(255 255 255 / .35)}
.word{font:900 clamp(30px,10vw,52px)/1.08 var(--display);letter-spacing:-.04em;margin:0;text-align:center;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;color:var(--ink);
  background:var(--paper);border-radius:var(--r-panel);padding:26px 16px;box-shadow:0 6px 0 #cfc4b0}
.mode{font:900 34px/1 var(--display);letter-spacing:-.04em;color:var(--mc);margin:0}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.diff button{background:var(--raise);border:2px solid var(--line);border-radius:var(--r-ctl);padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px;
  box-shadow:0 4px 0 var(--ink);transition:transform .12s var(--press),box-shadow .12s}
.diff button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.diff button b{font:900 30px var(--display);color:var(--mc)}
.board{display:grid;gap:6px}
.board .cat{font:800 10px/1.2 var(--body);text-align:center;color:var(--muted);hyphens:auto;overflow-wrap:break-word;min-width:0}
.board button{background:var(--paper);border:0;border-radius:10px;padding:13px 0;font:800 13px var(--display);letter-spacing:-.04em;color:var(--ink);box-shadow:0 3px 0 #cfc4b0;min-width:0}
.board button:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.board button:disabled{background:transparent;color:transparent;opacity:1;box-shadow:inset 0 0 0 2px var(--raise)}
.result{font:900 26px/1.15 var(--display);letter-spacing:-.03em;margin:0}
.ans{font:900 28px/1.1 var(--display);letter-spacing:-.03em;color:var(--gold);margin:0}
.full{width:100%}
.clockline{display:flex;align-items:center;gap:12px}
.clockline .clock{font-size:30px}
.secret{font-size:14px;font-weight:600;color:var(--muted);text-align:center;margin:0}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;padding:11px 14px;border-radius:12px;background:var(--ink);border-left:6px solid var(--c);font-weight:800}
.rank div:first-child{background:color-mix(in srgb,var(--c) 22%,var(--ink))}
form.row .big{padding:16px 20px}
.word.small{font-size:clamp(22px,7vw,32px);padding:14px 12px;flex:1}
.wordline{display:flex;gap:10px;align-items:center}
.wordline .word:not(.small){flex:1}
.lvl{font:900 13px var(--display);letter-spacing:-.02em;color:var(--ink);background:var(--mc,var(--gold));padding:7px 9px;border-radius:10px;white-space:nowrap}
.padwrap{margin:0 -6px}
.pad{touch-action:none;cursor:crosshair}
.board-canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--paper);box-shadow:0 5px 0 #cfc4b0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--sw);box-shadow:0 3px 0 var(--ink);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.sw.eraser{width:auto;border-radius:12px;padding:0 10px;font-weight:800;font-size:13px;color:var(--ink)}
.btn.small{padding:8px 11px;font-size:14px}
.row.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slf-head{display:flex;align-items:center;gap:14px}
.slf-head .clockline{flex:1}
.slf-letter{font:900 54px/1 var(--display);color:var(--ink);background:var(--paper);border-radius:16px;padding:4px 16px 10px;box-shadow:0 5px 0 #cfc4b0;transform:rotate(-3deg)}
.slf-field{display:flex;flex-direction:column;gap:4px}
.slf-field label{font-weight:800;font-size:15px;color:var(--muted)}
.slf-in{display:flex;gap:8px;align-items:center}
.slf-in .text{flex:1;padding:12px 14px;font-size:19px}
.slf-st{width:34px;text-align:center;font:900 22px var(--display)}
.slf-field.ok .text{border-color:var(--ok)} .slf-field.ok .slf-st{color:var(--ok)}
.slf-field.bad .text{border-color:var(--bad)} .slf-field.bad .slf-st{color:var(--bad)}
.slf-field.pend .slf-st{color:var(--gold)}
.slf-hint{font-size:13px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <section class="card" id="card"><p class="wait">Verbinde …</p></section>
</div>
<script src="/common.js"></script>
<script>
const qs = new URLSearchParams(location.search);
let room = (qs.get("r") || store.get("spieleabend-room") || "").toUpperCase();
let token = room ? (store.get("spieleabend-token-" + room) || "") : "";
let V = null, sse = null, lastKey = "", draft = {};
const act = (what, data) => post("act", { room, token, do:what, ...(data||{}) }).catch(e => { if (e.status === 404) roomGone(); else if (e.status === 401){ store.del("spieleabend-token-" + room); token = ""; render(); } else toast(e.message); });
// Raum ist weg (z. B. Server neu gestartet): zurück zur Code-Eingabe statt auf der alten Frage hängen zu bleiben
function roomGone(){
  if (sse){ sse.close(); sse = null; }
  if (room){ store.del("spieleabend-token-" + room); }
  store.del("spieleabend-room"); room = ""; token = ""; V = null; lastKey = "";
  try { history.replaceState(null, "", "/"); } catch(e){}
  renderCode("Der Raum ist weg, z. B. weil der Server neu gestartet wurde. Scanne den neuen QR-Code am Fernseher oder gib den neuen Code ein.");
}
const buzzFeel = () => { try { navigator.vibrate && navigator.vibrate(60); } catch(e){} };
function toast(m){ const p = el("p", "err", m); $("card").prepend(p); setTimeout(() => p.remove(), 3500); }

function start(){
  if (!room){ renderCode(); return; }
  store.set("spieleabend-room", room);
  if (sse) sse.close();
  sse = connect({ room, token }, v => {
    if (token && !v.you){ store.del("spieleabend-token-" + room); token = ""; return start(); }
    const key = [v.game, v.phase, v.cur && v.cur.q, v.isExplainer, v.round].join("|");
    if (key !== lastKey && V){ if ((v.phase === "buzz" && v.cur) || (v.game === "act" && v.isExplainer && v.phase === "choose") || (v.game === "leo" && v.phase === "board" && v.you && v.turn === v.you.team)) buzzFeel(); }
    const fresh = key !== lastKey; lastKey = key; V = v; render();
    if (fresh){ const cd = $("card"); cd.classList.add("enter"); setTimeout(() => cd.classList.remove("enter"), 700); }
  }, ok => { const c = document.querySelector(".head .conn"); if (c) c.textContent = ok ? "" : "offline"; },
  (t, d) => { if (t === "drawsync" && V && V.isExplainer && !pad.B.strokes.length) pad.B.sync(d); },
  roomGone);
}

/* Eingaben bei Updates behalten */
function keepInputs(fn){
  const a = document.activeElement, id = a && a.id;
  document.querySelectorAll("input[id]").forEach(i => draft[i.id] = i.value);
  fn();
  document.querySelectorAll("input[id]").forEach(i => { if (draft[i.id] != null && !i.dataset.fresh) i.value = draft[i.id]; });
  if (id && $(id)) $(id).focus();
}

function renderCode(msg){
  $("head").innerHTML = "";
  const c = $("card"); c.innerHTML = ""; c.style.removeProperty("--c"); c.style.removeProperty("--mc");
  c.appendChild(el("h1", "title", "Spieleabend"));
  c.appendChild(el("p", msg ? "notice" : "wait", msg || "Scanne den QR-Code am Host-Bildschirm oder gib den Raum-Code ein."));
  const f = el("form", "row"); const i = el("input", "text"); i.id = "code"; i.maxLength = 4; i.placeholder = "z. B. KXQT"; i.autocapitalize = "characters"; i.style.flex = "1";
  const b = el("button", "big", "Weiter"); f.append(i, b);
  f.onsubmit = e => { e.preventDefault(); room = i.value.trim().toUpperCase(); if (room.length === 4){ token = store.get("spieleabend-token-" + room) || ""; start(); } };
  c.appendChild(f);
}

function render(){ keepInputs(_render); }
function _render(){
  const c = $("card"); c.innerHTML = ""; c.style.removeProperty("--c"); c.style.removeProperty("--mc");
  const h = $("head"); h.innerHTML = "";
  if (!V.you){ renderJoin(c); return; }
  const me = V.you, myT = V.teams[me.team];
  h.append(el("span", "me", me.name), el("span", "conn"));
  const tc = el("span", "chip team", myT ? myT.name : ""); tc.style.setProperty("--c", TC(me.team)); h.appendChild(tc);
  c.style.setProperty("--c", TC(me.team));
  if (!V.game) return renderLobby(c);
  if (V.phase === "end") return renderEnd(c);
  if (V.game === "sch") renderSch(c);
  if (V.game === "leo") renderLeo(c);
  if (V.game === "act") renderAct(c);
  if (V.game === "slf") renderSlf(c);
}

function renderJoin(c){
  c.appendChild(el("h1", "title", "Spieleabend"));
  c.appendChild(el("p", "wait", "Gib deinen Namen ein. Die Teams werden automatisch verteilt."));
  const f = el("form"); f.style.cssText = "display:flex;flex-direction:column;gap:10px";
  const i = el("input", "text"); i.id = "name"; i.maxLength = 20; i.placeholder = "Dein Name"; i.autocomplete = "nickname";
  const b = el("button", "big full", "Mitspielen"); const err = el("p", "err");
  f.append(i, b, err);
  f.onsubmit = async e => { e.preventDefault();
    try { const r = await post("join", { room, name:i.value, token }); token = r.token; store.set("spieleabend-token-" + room, token); start(); }
    catch(x){ err.textContent = x.message; } };
  c.appendChild(f);
  setTimeout(() => i.focus(), 50);
}

function renderLobby(c){
  const t = V.teams[V.you.team];
  c.appendChild(el("p", "eyebrow", "Du spielst in"));
  c.appendChild(el("p", "bigteam", t.name));
  const m = el("div", "mates");
  t.members.forEach(x => { const s = el("span", "chip" + (x.id === V.you.id ? " done" : ""), x.name); s.style.setProperty("--c", TC(V.you.team)); m.appendChild(s); });
  c.appendChild(m);
  c.appendChild(el("p", "wait", "Der Host-Bildschirm wählt das Spiel. Gleich geht's los."));
}

/* ---------- Schätz-Duell ---------- */
function renderSch(c){
  const Q = V.q, mine = V.guesses.find(p => p.id === V.you.id);
  c.appendChild(el("p", "eyebrow", Q.cat + " · Frage " + (V.round+1) + " / " + V.total));
  c.appendChild(el("p", "q", Q.text));
  if (V.phase === "guess"){
    if (V.endAt){ const l = el("div", "clockline"); l.append(countdown(V.endAt), timebar(V.endAt, V.time)); c.appendChild(l); }
    const f = el("form"); f.style.cssText = "display:flex;flex-direction:column;gap:10px";
    const fl = el("div", "field"); const i = el("input"); i.id = "guess-" + V.round; i.inputMode = "decimal"; i.autocomplete = "off";
    i.placeholder = Q.year ? "Jahr" : "Deine Schätzung"; fl.append(i, el("span", "unit", Q.unit));
    const b = el("button", "big full", mine.submitted ? "Ändern" : "Abschicken"); const err = el("p", "err");
    f.append(fl, b, err);
    f.onsubmit = e => { e.preventDefault(); const n = parseNum(i.value);
      if (isNaN(n)){ err.textContent = "Bitte eine Zahl eingeben, z. B. 2850, 3,05 oder 1,8 Mio."; return; }
      act("guess", { value:n }); i.blur(); };
    c.appendChild(f);
    if (mine.submitted) c.appendChild(el("p", "wait", "Abgeschickt: " + (Q.year ? mine.value : fmt(mine.value) + " " + Q.unit) + ". Du kannst bis zur Auflösung ändern."));
    const left = V.guesses.filter(p => !p.submitted).length;
    c.appendChild(el("p", "secret", left ? "Noch " + left + " am Schätzen …" : "Alle haben geschätzt!"));
    return;
  }
  const a = V.answer.value;
  c.appendChild(el("p", "eyebrow", "Richtige Antwort"));
  c.appendChild(el("p", "ans", Q.year ? String(a) : fmt(a) + " " + Q.unit));
  if (mine.value != null){
    c.appendChild(el("p", "result", mine.pts ? "+" + mine.pts + (mine.hit ? " · Volltreffer!" : " · Am nächsten dran!") : "Kein Punkt"));
    c.appendChild(el("p", "wait", "Deine Schätzung: " + (Q.year ? mine.value : fmt(mine.value)) + " · " + pct(mine.value, a) + " daneben"));
  } else c.appendChild(el("p", "wait", "Du hast nicht geschätzt."));
  c.appendChild(el("p", "secret", "Die Auflösung siehst du am Host-Bildschirm."));
}

/* ---------- Leopardy ---------- */
function renderLeo(c){
  const my = V.you.team, cur = V.cur, tn = i => V.teams[i].name;
  if (V.phase === "board"){
    if (V.turn !== my){ c.appendChild(el("p", "q", tn(V.turn) + " wählt ein Feld …")); c.appendChild(el("p", "wait", "Halte den Finger bereit. Sobald die Frage kommt, wird gebuzzert.")); return; }
    c.appendChild(el("p", "q", "Ihr seid dran! Wählt ein Feld."));
    const bd = el("div", "board"); bd.style.gridTemplateColumns = `repeat(${V.board.cats.length}, minmax(0,1fr))`;
    V.board.cats.forEach(n => bd.appendChild(el("div", "cat", n)));
    V.board.rows.forEach(row => V.board.cats.forEach((n, ci) => {
      const b = el("button", null, row.value); b.disabled = V.board.used[ci + "-" + row.lv] !== undefined;
      b.setAttribute("aria-label", n + " für " + row.value); b.onclick = () => act("pick", { ci, lv:row.lv }); bd.appendChild(b);
    }));
    c.appendChild(bd);
    return;
  }
  c.appendChild(el("p", "eyebrow", cur.cat + " · " + cur.value));
  c.appendChild(el("p", "q", cur.q));
  if (V.phase === "buzz"){
    if (cur.tried.includes(my)){ c.appendChild(el("p", "wait", "Euer Team hat schon geantwortet. Jetzt sind die anderen dran.")); }
    else { const b = el("button", "buzz", "BUZZ"); b.onclick = () => { buzzFeel(); act("buzz"); }; c.appendChild(b); }
    const l = el("div", "clockline"); l.append(countdown(V.endAt), timebar(V.endAt, cur.wrongs.length ? 20 : 35)); c.appendChild(l);
  }
  if (V.phase === "answer" && V.cur.checking) c.appendChild(el("p", "notice", "KI prüft die Antwort …"));
  if (V.phase === "answer"){
    if (cur.buzzTeam === my && V.input === "rufen"){
      c.appendChild(el("p", "result", (cur.buzzName === V.you.name ? "Du hast gebuzzert!" : cur.buzzName + " hat gebuzzert!") + " Sagt die Antwort laut."));
      c.appendChild(el("p", "wait", "Der Spielleiter am Host-Bildschirm entscheidet, ob es stimmt."));
    } else if (cur.buzzTeam === my){
      c.appendChild(el("p", "result", cur.buzzName === V.you.name ? "Du hast gebuzzert! Antwort eintippen:" : cur.buzzName + " hat gebuzzert. Eure Antwort:"));
      const f = el("form"); f.style.cssText = "display:flex;flex-direction:column;gap:10px";
      const i = el("input", "text"); i.id = "answer-" + cur.q.length + "-" + cur.wrongs.length; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false; i.placeholder = "Antwort";
      const b = el("button", "big full", "Antwort senden"); f.append(i, b);
      f.onsubmit = e => { e.preventDefault(); if (i.value.trim()) act("answer", { text:i.value }); };
      c.appendChild(f);
      c.appendChild(el("p", "secret", "Kleine Tippfehler sind kein Problem."));
      setTimeout(() => { if (document.activeElement !== i) i.focus(); }, 50);
    } else c.appendChild(el("p", "wait", tn(cur.buzzTeam) + " war schneller und antwortet gerade …"));
    const l = el("div", "clockline"); l.append(countdown(V.endAt), timebar(V.endAt, cur.answerSec)); c.appendChild(l);
  }
  if (V.phase === "result"){
    c.appendChild(el("p", "result", cur.ok ? (cur.winner === my ? "Richtig! +" + cur.value + " für euch" : tn(cur.winner) + " hatte recht") : "Keiner wusste es"));
    c.appendChild(el("p", "ans", cur.answer));
    const mine = cur.wrongs.filter(w => w.team === my);
    if (mine.length) c.appendChild(el("p", "wait", "Eure Antwort „" + mine[0].text + "“ war leider falsch (−" + cur.value + ")."));
  }
}

/* ---------- Erklären & Pantomime ---------- */
const MODE_N = { say:"Erklären", mime:"Pantomime", draw:"Zeichnen" }, MODE_C = { say:"var(--say)", mime:"var(--mime)", draw:"var(--draw)" };
/* Zeichenblock der zeichnenden Person: bleibt über Neuzeichnungen erhalten, schickt Striche gebündelt an den Server */
const pad = (() => {
  const B = makeBoard(), cv = B.cv;
  const P = { B, color:0, size:1, pending:new Map(), sending:false, cur:null };
  cv.classList.add("pad");
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  const queue = (s, pts) => { const q = P.pending.get(s.id) || { id:s.id, c:s.c, w:s.w, p:[] }; q.p.push(...pts); P.pending.set(s.id, q); };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const s = { id:Math.random().toString(36).slice(2, 10), c:P.color, w:P.size, p:[pos(e)] };
    P.cur = s; B.strokes.push(s); B.seg(s, 0); queue(s, s.p.slice());
  });
  cv.addEventListener("pointermove", e => {
    if (!P.cur) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e], pts = (evs.length ? evs : [e]).map(pos);
    const from = P.cur.p.length; P.cur.p.push(...pts); B.seg(P.cur, from); queue(P.cur, pts);
  });
  const up = () => { P.cur = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up); cv.addEventListener("lostpointercapture", up);
  // Nacheinander senden, damit kein Strichstück das vorige überholt
  setInterval(async () => {
    if (P.sending || !P.pending.size || !V) return;
    const segs = [...P.pending.values()]; P.pending.clear(); P.sending = true;
    try { await post("act", { room, token, do:"draw", n:B.n, segs }); } catch(e){}
    P.sending = false;
  }, 60);
  return P;
})();
function padTools(){
  const t = el("div", "tools");
  INK.forEach((col, i) => {
    const b = el("button", "sw" + (i === 4 ? " eraser" : "")); b.style.setProperty("--sw", col); b.setAttribute("aria-pressed", pad.color === i);
    b.setAttribute("aria-label", i === 4 ? "Radierer" : "Farbe " + (i + 1)); if (i === 4) b.textContent = "Radierer";
    b.onclick = () => { pad.color = i; if (i === 4 && pad.size < 2) pad.size = 2; else if (i !== 4 && pad.size === 2) pad.size = 1; render(); };
    t.appendChild(b);
  });
  const sz = el("button", "btn small", pad.size === 0 ? "Dünn" : pad.size === 1 ? "Mittel" : "Dick");
  sz.onclick = () => { pad.size = (pad.size + 1) % 3; render(); };
  const un = el("button", "btn small", "Zurück"); un.onclick = () => { pad.B.strokes.pop(); pad.B.redraw(); act("undo", { n:pad.B.n }); };
  const cl = el("button", "btn small", "Löschen"); cl.onclick = () => { pad.B.strokes = []; pad.B.redraw(); act("clear", { n:pad.B.n }); };
  t.append(sz, un, cl);
  return t;
}

function renderAct(c){
  const my = V.you.team, mine = V.turn === my, tn = V.teams[V.turn].name;
  const mc = MODE_C[V.mode], mname = MODE_N[V.mode];
  c.style.setProperty("--mc", mc);
  if (V.phase === "who"){
    c.appendChild(el("p", "mode", mname));
    if (V.all) c.appendChild(el("p", "result", "Alle Teams dürfen raten!"));
    if (mine){
      c.appendChild(el("p", "q", "Wer von euch macht es?"));
      const b = el("button", "big full", "Ich mach's!"); b.style.setProperty("--c", mc); b.onclick = () => act("claim"); c.appendChild(b);
      if (V.suggestName) c.appendChild(el("p", "secret", "Vorschlag: " + V.suggestName));
    } else c.appendChild(el("p", "wait", tn + " sucht jemanden aus …"));
    return;
  }
  if (V.isExplainer){
    if (V.phase !== "run") c.appendChild(el("p", "mode", mname));
    if (V.phase === "choose"){
      c.appendChild(el("p", "q", "Wie schwer soll es losgehen?"));
      const d = el("div", "diff");
      [[1,"Leicht"],[2,"Mittel"],[3,"Schwer"]].forEach(([lv, l]) => { const b = el("button"); b.appendChild(el("b", null, lv)); b.append(l); b.onclick = () => act("diff", { level:lv }); d.appendChild(b); });
      c.appendChild(d);
      c.appendChild(el("p", "secret", "Die Zahl ist die Punktzahl pro erratenem Begriff, die ganze Runde lang. Die Begriffe werden nach jedem Treffer ein bisschen schwerer."));
      const u = el("button", "btn", "Doch nicht ich"); u.onclick = () => act("unclaim"); c.appendChild(u);
    }
    if (V.phase === "ready"){
      c.appendChild(el("p", "secret", V.mode === "draw" ? "Nur du siehst den Begriff. Gezeichnet wird hier am Handy, das Bild erscheint am Fernseher. Keine Buchstaben oder Zahlen malen!" : "Nur du siehst den Begriff. Handy nicht herzeigen!"));
      c.appendChild(el("p", "word", V.word));
      const r = el("div", "row center");
      const s = el("button", "btn", "Anderer Begriff"); s.onclick = () => act("swapWord");
      const go = el("button", "big", "Start"); go.style.setProperty("--c", mc); go.onclick = () => act("go");
      r.append(s, go); c.appendChild(r);
    }
    if (V.phase === "run"){
      const l = el("div", "clockline"); l.append(countdown(V.endAt), timebar(V.endAt, V.time)); c.appendChild(l);
      const wl = el("div", "wordline"); wl.append(el("p", "word" + (V.mode === "draw" ? " small" : ""), V.word), el("span", "lvl", "Stufe " + V.level));
      c.appendChild(wl);
      if (V.mode === "draw"){
        if (pad.B.n !== V.drawN){ pad.B.reset(V.drawN); pad.pending.clear(); }
        const w = el("div", "padwrap"); w.appendChild(pad.B.cv); c.appendChild(w); requestAnimationFrame(pad.B.fit);
        c.appendChild(padTools());
      }
      if (V.input === "tippen"){
        c.appendChild(el("p", "wait", (V.all ? "Alle" : "Dein Team") + " tippen die Lösung. Ist sie richtig, kommt automatisch der nächste Begriff."));
        renderFeed(c);
      } else if (V.all){
        c.appendChild(el("p", "eyebrow", "Wer hat's erraten?"));
        const r = el("div", "row");
        V.teams.forEach((t, i) => { if (!t.members.length) return; const b = el("button", "big", t.name); b.style.setProperty("--c", TC(i)); b.onclick = () => { buzzFeel(); act("got", { team:i }); }; r.appendChild(b); });
        c.appendChild(r);
      } else { const b = el("button", "big full", "Richtig! +" + V.pts); b.style.setProperty("--c", "var(--ok)"); b.onclick = () => { buzzFeel(); act("got"); }; c.appendChild(b); }
      const r2 = el("div", "row two");
      const sk = el("button", "btn", "Überspringen"); sk.onclick = () => act("skip");
      const f = el("button", "btn", "Runde beenden"); f.onclick = () => act("fail");
      r2.append(sk, f); c.appendChild(r2);
      c.appendChild(el("p", "secret", V.guessed + " erraten. Überspringen kostet nichts, die Stufe bleibt gleich."));
    }
    if (V.phase === "result"){
      renderWords(c);
      const n = el("button", "big full", "Nächstes Team"); n.onclick = () => act("actNext"); c.appendChild(n);
    }
    return;
  }
  // alle anderen
  c.appendChild(el("p", "mode", mname));
  const guessing = V.all || mine;
  if (V.phase === "choose" || V.phase === "ready") c.appendChild(el("p", "q", V.explainerName + (V.phase === "choose" ? " wählt, wie schwer es losgeht …" : " schaut sich den Begriff an …")));
  if (V.watching && V.word){
    // Mitfiebern: andere Teams sehen den Begriff
    c.appendChild(el("p", "secret", tn + " ist dran. Der Begriff zum Mitfiebern, nicht vorsagen!"));
    const wl = el("div", "wordline"); wl.append(el("p", "word small", V.word)); if (V.level) wl.appendChild(el("span", "lvl", "Stufe " + V.level));
    c.appendChild(wl);
  }
  if (V.phase === "run"){
    const l = el("div", "clockline"); l.append(countdown(V.endAt), timebar(V.endAt, V.time)); c.appendChild(l);
    const look = { say:"Hör gut zu", mime:"Schau genau hin", draw:"Schau auf den Fernseher" }[V.mode];
    if (V.canType){
      c.appendChild(el("p", "q", look + " und tippe die Lösung ein!"));
      const f = el("form", "row"); const i = el("input", "text"); i.id = "wordguess"; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false; i.placeholder = "Lösung"; i.style.flex = "1";
      const b = el("button", "big", "Senden"); f.append(i, b);
      f.onsubmit = e => { e.preventDefault(); const t = i.value.trim(); if (!t) return; draft.wordguess = ""; i.value = ""; act("guessWord", { text:t }); i.focus(); };
      c.appendChild(f);
      const last = V.feed.filter(x => x.name === V.you.name).slice(-1)[0];
      if (last) c.appendChild(el("p", last.ok ? "result" : "err", last.ok ? "Richtig! " + last.text : "„" + last.text + "“ ist es nicht"));
      renderFeed(c);
    } else if (guessing) c.appendChild(el("p", "q", look + " und rate laut!"));
    c.appendChild(el("p", "result", V.guessed + (V.guessed === 1 ? " Begriff" : " Begriffe") + " erraten"));
  }
  if (V.phase === "result") renderWords(c);
  else if (!V.watching) c.appendChild(el("p", "secret", "Den Begriff sieht nur " + (V.explainerName || "die Person, die dran ist") + (V.all ? "." : " und die anderen Teams.")));
}

/* ---------- Stadt-Land-Fluss ---------- */
function renderSlf(c){
  const ncat = V.cats.length;
  if (V.phase === "write"){
    const top = el("div", "slf-head");
    top.append(el("span", "slf-letter", V.letter));
    const cl = el("div", "clockline"); cl.append(countdown(V.endAt), timebar(V.endAt, 120)); top.appendChild(cl);
    c.appendChild(top);
    const mine = V.mine || [];
    const okN = mine.filter(e => e && e.st === "ok").length;
    c.appendChild(el("p", "secret", okN + " von " + ncat + " richtig. Wer zuerst alle hat, stoppt die Runde für alle!"));
    V.cats.forEach((cat, ci) => {
      const e = mine[ci], id = "slf-" + V.round + "-" + ci;
      const f = el("form", "slf-field" + (e ? " " + e.st : ""));
      const lab = el("label", null, cat); lab.htmlFor = id;
      const row = el("div", "slf-in");
      const i = el("input", "text"); i.id = id; i.autocomplete = "off"; i.autocapitalize = "words"; i.spellcheck = false; i.maxLength = 40; i.placeholder = V.letter + " …";
      if (e && draft[id] == null) i.value = e.t;
      const send = () => { if (!i.isConnected) return; const t = i.value.trim(); if ((e ? e.t : "") === t) return; act("slfAns", { ci, text:t }); };
      i.addEventListener("blur", send);
      f.onsubmit = ev => { ev.preventDefault(); send(); const nx = $("slf-" + V.round + "-" + (ci + 1)); if (nx) nx.focus(); else i.blur(); };
      const ic = el("span", "slf-st", !e ? "" : e.st === "ok" ? "✓" : e.st === "bad" ? "✗" : "…");
      row.append(i, ic); f.append(lab, row);
      if (e && e.st === "bad") f.appendChild(el("small", "slf-hint", e.hint || "Passt nicht"));
      if (e && e.st === "pend") f.appendChild(el("small", "slf-hint", "KI prüft …"));
      c.appendChild(f);
    });
    return;
  }
  if (V.phase === "review"){
    c.appendChild(el("p", "result", V.stopBy ? "Stopp! " + V.stopBy + " war am schnellsten." : "Zeit um!"));
    const myPts = V.roundPts ? V.roundPts[V.you.id] || 0 : 0;
    c.appendChild(el("p", "bigteam", "+" + myPts + " Punkte"));
    const mine = V.mine || [];
    const list = el("div", "rank");
    V.cats.forEach((cat, ci) => { const e = mine[ci]; const row = el("div"); row.style.setProperty("--c", e && e.st === "ok" ? "var(--ok)" : "var(--bad)");
      row.append(el("span", null, cat + ": " + (e ? e.t : "–")), el("span", "num", e && e.st === "ok" ? "✓" : "✗")); list.appendChild(row); });
    c.appendChild(list);
    if (V.comment) c.appendChild(aiLine(V.comment));
    c.appendChild(el("p", "secret", "Die Auswertung steht am Fernseher. Gleich geht's weiter."));
  }
}

function renderFeed(c){
  if (!V.feed || !V.feed.length) return;
  const m = el("div", "mates");
  V.feed.slice(-6).forEach(x => { const s = el("span", "chip" + (x.ok ? " done" : ""), x.name + ": " + x.text + (x.ok ? " ✓" : x.pending ? " …" : "")); s.style.setProperty("--c", TC(x.team)); m.appendChild(s); });
  c.appendChild(m);
}
function renderWords(c){
  const got = V.words.filter(x => x.team != null);
  c.appendChild(el("p", "result", got.length ? got.length + (got.length === 1 ? " Begriff" : " Begriffe") + " erraten" : "Kein Begriff erraten"));
  const m = el("div", "mates");
  V.words.forEach(x => { const s = el("span", "chip" + (x.team != null ? " done" : " off"), x.w + (x.team != null ? " +" + x.pts : "")); s.style.setProperty("--c", x.team != null ? TC(x.team) : "var(--muted)"); m.appendChild(s); });
  c.appendChild(m);
}

function renderEnd(c){
  const r = V.ranking || [];
  c.appendChild(el("p", "eyebrow", "Spielende"));
  c.appendChild(el("p", "title", (r[0]?.name || "–") + " gewinnt!"));
  const d = el("div", "rank");
  r.forEach((x, i) => { const row = el("div"); row.style.setProperty("--c", (V.game === "sch" && V.mode === "solo") || V.game === "slf" ? PC[i % PC.length] : TC(x.team));
    row.append(el("span", null, (i+1) + ". " + x.name), el("span", "num", x.score + " P")); d.appendChild(row); });
  c.appendChild(d);
  if (V.comment) c.appendChild(aiLine(V.comment));
}

start();
</script>
