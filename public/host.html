<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spieleabend Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
/* Host: Kopfzeile, Bühne in der Mitte, Punktestand unten. Gedacht für Laptop/TV, lesbar aus ein paar Metern. */
body{padding:18px 28px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:900 22px/1 var(--display);letter-spacing:-.03em;color:var(--ink);background:var(--gold);padding:9px 14px 10px;border-radius:12px;transform:rotate(-2deg);box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 45%,var(--ink))}
.code{font:800 18px var(--display);letter-spacing:.14em;padding:7px 14px;border-radius:12px;background:var(--ink);color:var(--fg)}
.top .sp{flex:1}
.miniqr{display:flex;align-items:center;gap:10px;background:var(--ink);padding:6px 12px 6px 6px;border-radius:14px;font-size:13px;font-weight:600;color:var(--muted)}
.miniqr .q{background:#fff;border-radius:8px;padding:4px;line-height:0}
.miniqr .q img{width:64px;height:64px;display:block}
.conn{font-size:13px;font-weight:700;color:var(--muted)}
.conn.off{color:var(--fg);background:var(--bad);padding:4px 10px;border-radius:999px}
#topBtns{display:flex;gap:8px;align-items:center}
.btn.music[aria-pressed="false"]{color:var(--muted);border-style:dashed}

.stage{flex:1;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;text-align:center;min-height:0}
.stage.top{justify-content:flex-start}
.eyebrow{font:700 clamp(15px,1.4vw,20px) var(--body);color:var(--muted);margin:0}
.eyebrow b{color:var(--gold)}
.hq{font:700 clamp(28px,3.4vw,52px)/1.2 var(--body);margin:0;max-width:30ch;text-wrap:balance}
.huge{font:900 clamp(56px,9vw,150px)/.95 var(--display);margin:0;letter-spacing:-.04em;text-wrap:balance}
.ans{font:900 clamp(40px,6vw,96px)/1 var(--display);letter-spacing:-.03em;color:var(--gold);margin:0;text-wrap:balance}
.ans small{display:block;font:600 20px var(--body);letter-spacing:0;color:var(--muted);margin-top:12px}
.stage .clock{font-size:clamp(48px,6.5vw,96px)}
.ctrl .clock{font-size:inherit;margin-left:6px}
.stage .bar{max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1040px}
.chips .chip{font-size:17px;padding:7px 15px}
.verdict{font:900 clamp(30px,4vw,60px)/1.05 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.tally{color:var(--gold)}
.stage .bar + .verdict{margin-top:-4px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Lobby: links die Einlass-Karte, rechts Teams und Spiele */
.lobby{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:32px;width:100%;max-width:1320px;text-align:left;align-items:start}
.join{background:var(--paper);color:var(--ink);border-radius:24px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;
  box-shadow:0 8px 0 #cfc4b0,0 24px 50px rgb(20 3 22 / .5);transform:rotate(-1deg);position:sticky;top:18px}
.join .q{background:#fff;border-radius:14px;padding:10px;line-height:0;border:3px solid var(--ink)}
.join .q img{width:232px;height:232px;display:block;image-rendering:pixelated}
.join h2{font:900 26px/1.05 var(--display);letter-spacing:-.03em;margin:0}
.join .url{font:700 15px var(--body);word-break:break-all;color:#6b3a6f}
.join .codebig{font:900 48px/1 var(--display);letter-spacing:.12em;color:var(--ink);background:var(--gold);padding:8px 14px 10px 22px;border-radius:14px}
.join .muted{color:#6b3a6f;font-weight:700}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.side > .lbl{font:800 20px var(--display);letter-spacing:-.02em;color:var(--fg);margin-top:6px}
.side > .row > .lbl{font:800 20px var(--display);letter-spacing:-.02em;color:var(--fg);margin-right:6px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tcol{background:var(--panel);border-radius:var(--r-panel);border:2px solid var(--line);border-top:6px solid var(--c);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcol input{background:transparent;border:0;border-bottom:2px dashed color-mix(in srgb,var(--c) 40%,transparent);font:800 19px var(--display);letter-spacing:-.02em;color:var(--c);padding:6px 0 4px;width:100%;min-width:0}
.tcol .m{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700}
.tcol .m.off{opacity:.45}
.tcol .m button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:8px}
.tcol .m button:hover{background:var(--bad);color:var(--fg)}
.tcol .empty{color:var(--muted);font-size:14px;font-weight:600}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.game{background:var(--panel);border-radius:var(--r-panel);padding:20px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.game h3{margin:0;font:900 23px/1.05 var(--display);letter-spacing:-.03em}
.game p{margin:0;color:var(--muted);line-height:1.45;font-size:15px}
.game .opt{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.game .big{margin-top:auto;width:100%}
.last{background:var(--ink);border-radius:var(--r-ctl);padding:12px 16px;color:var(--muted);font-weight:600}
.last b{color:var(--gold)}

/* Punktestand: Anzeigetafel am unteren Rand */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sc{background:var(--ink);border-radius:var(--r-panel);padding:12px 16px;display:flex;align-items:center;gap:12px;min-width:0;border:2px solid transparent;transition:border-color .2s,transform .2s var(--press)}
.sc .n{font-weight:800;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:18px}
.sc .p{font:900 40px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sc .pm{display:flex;flex-direction:column;gap:3px;opacity:.5;transition:opacity .15s}
.sc:hover .pm,.sc .pm:focus-within{opacity:1}
.sc .pm button{border:0;background:var(--raise);border-radius:6px;font-size:12px;font-weight:700;padding:2px 7px;color:var(--muted)}
.sc .pm button:hover{background:var(--line);color:var(--fg)}
.sc.turn{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--ink));transform:translateY(-4px)}

/* Leopardy: Papierkarten auf der Bühne */
.board{display:grid;gap:10px;width:100%;max-width:1220px}
.board .cat{font:800 clamp(12px,1.25vw,17px)/1.2 var(--body);padding:10px 4px 12px;color:var(--fg);border-bottom:4px solid var(--gold);text-wrap:balance}
.tile{font:900 clamp(20px,2.5vw,40px) var(--display);letter-spacing:-.03em;color:var(--ink);background:var(--paper);border:0;border-radius:var(--r-ctl);padding:clamp(10px,1.4vw,22px) 4px;
  box-shadow:0 5px 0 #cfc4b0;transition:transform .12s var(--press),box-shadow .12s}
.tile:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #cfc4b0}
.tile:disabled{opacity:1;background:transparent;color:transparent;box-shadow:inset 0 0 0 2px var(--panel)}
.tile.won{color:var(--c);font:800 15px var(--body);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.wrongs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Schätz-Auflösung */
.glist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:100%;max-width:1120px}
.g{border-radius:var(--r-ctl);padding:10px 14px;background:var(--ink);border:2px solid transparent;text-align:left;min-width:0}
.g.win{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--ink))}
.g .w{font-weight:800;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .v{font:900 26px/1.15 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.g .o{font-size:13px;font-weight:600;color:var(--muted)}
.tapebox{width:100%;max-width:1120px}

.mode{font:900 clamp(48px,7.5vw,120px)/1 var(--display);letter-spacing:-.04em;color:var(--mc);margin:0}
.levelline{display:flex;gap:16px;align-items:baseline;justify-content:center;margin:0;font-weight:700;font-size:20px}
.lvl{font:900 22px var(--display);letter-spacing:-.02em;color:var(--ink);background:var(--mc,var(--gold));padding:6px 12px;border-radius:10px}
.lvlpts{font:800 22px var(--display);letter-spacing:-.02em}
.drawhead{display:grid;grid-template-columns:1fr minmax(240px,420px) 1fr;gap:20px;align-items:center;width:100%;max-width:1200px}
.dh-who{text-align:left;display:flex;flex-direction:column;gap:4px}
.dh-who p{margin:0;font:700 clamp(20px,2vw,30px) var(--body)}
.dh-mode{font:900 clamp(26px,2.6vw,40px)/1 var(--display);letter-spacing:-.04em;color:var(--mc)}
.dh-clock{display:flex;flex-direction:column;gap:8px;align-items:center}
.stage .dh-clock .clock{font-size:clamp(40px,4.5vw,68px)}
.dh-score{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:700}
.board-wrap{width:min(100%, calc((100dvh - 420px) * 4 / 3));min-width:300px}
.stage:has(.board-wrap){gap:14px}
.board-canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:var(--r-panel);background:var(--paper);box-shadow:0 8px 0 #cfc4b0,0 24px 50px rgb(20 3 22 / .5)}
.podium{display:flex;flex-direction:column;gap:10px;width:100%;max-width:660px}
.podium div{display:flex;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:var(--r-panel);background:var(--ink);border-left:8px solid var(--c);font:700 24px var(--body)}
.podium div:first-child{font:900 32px var(--display);letter-spacing:-.03em;background:color-mix(in srgb,var(--c) 22%,var(--ink));padding:20px 24px;transform:scale(1.03)}
.confirm{display:flex;gap:8px;align-items:center;font-weight:700}
.aibox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);border-radius:var(--r-ctl);padding:10px 14px}
.aibox .lbl{color:var(--fg);font:800 16px var(--display);letter-spacing:-.02em}
.ai-status{font-size:14px;font-weight:600;color:var(--muted)}
.ai-status.on{color:var(--ok)}
.slf-top{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}
.slf-letter{font:900 clamp(110px,15vw,220px)/1 var(--display);color:var(--ink);background:var(--paper);border-radius:28px;padding:10px 40px 20px;box-shadow:0 10px 0 #cfc4b0;transform:rotate(-3deg)}
.slf-cats{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.slf-cat{font:800 clamp(20px,2.2vw,32px) var(--display);letter-spacing:-.02em;background:var(--ink);padding:8px 18px;border-radius:14px}
.slf-table{display:flex;flex-direction:column;gap:10px;width:100%;max-width:1200px;text-align:left}
.slf-row{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:start;background:var(--ink);border-radius:var(--r-ctl);padding:10px 12px}
.slf-rowcat{font:800 17px var(--display);letter-spacing:-.02em;padding-top:6px}
.slf-cells{display:flex;flex-wrap:wrap;gap:8px}
.slf-ans{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 4px;font:600 16px var(--body);border-radius:12px;padding:6px 12px;border:2px solid var(--c,var(--line));background:color-mix(in srgb,var(--c,var(--line)) 14%,transparent);color:var(--fg);text-align:left}
.slf-ans b{color:var(--c)}
.slf-ans .pts{font-weight:800;color:var(--gold)}
.slf-ans.bad{opacity:.6;text-decoration:line-through;border-style:dashed}
.slf-ans.bad .pts{color:var(--bad)}
.slf-ans small{flex-basis:100%;font-size:12px;text-decoration:none;color:var(--muted)}
.slf-ans.empty{opacity:.4;border:2px dashed var(--line);background:transparent}
@media (max-width:900px){ .slf-row{grid-template-columns:1fr} }
@media (max-width:900px){ .lobby{grid-template-columns:1fr} .join{position:static;transform:none} body{padding:14px 16px 20px} }
</style>
</head>
<body>
<div class="top">
  <div class="logo">Spieleabend</div>
  <div class="code" id="code">····</div>
  <div class="sp"></div>
  <div class="miniqr" id="miniqr" hidden></div>
  <span class="conn" id="conn">verbinde …</span>
  <span id="topBtns"></span>
</div>
<main class="stage" id="stage"><p class="muted">Raum wird erstellt …</p></main>
<div class="scores" id="scores"></div>

<script src="/qrcode.js"></script>
<script src="/common.js"></script>
<script>
let V = null, H = store.get("spieleabend-host"), sse = null, confirmEnd = false, lastPhase = "";
const opts = store.get("spieleabend-opts") || { sch:{ mode:"solo", rounds:10, time:60, cats:[] }, leo:{ board:"kurz", input:"tippen" }, act:{ time:90, goal:50, input:"rufen" } };
opts.leo.input = opts.leo.input || "tippen"; opts.act.input = opts.act.input || "rufen";
if (![20,30,40,50].includes(opts.act.goal)) opts.act.goal = 30;
if (opts.act.all !== "aus") opts.act.all = "an";
if (!opts.slf || ![3,5,8].includes(opts.slf.rounds)) opts.slf = { rounds:5 };
if (!Array.isArray(opts.act.modes) || !opts.act.modes.length) opts.act.modes = ["say","mime","draw"];
const MODE_N = { say:"Erklären", mime:"Pantomime", draw:"Zeichnen" }, MODE_C = { say:"var(--say)", mime:"var(--mime)", draw:"var(--draw)" };
const board = makeBoard();
const saveOpts = () => store.set("spieleabend-opts", opts);
const host = (what, data) => post("host", { room:H.room, hostToken:H.hostToken, do:what, ...(data||{}) }).catch(e => { if (e.status === 404) roomGone(); else flash(e.message); });

function joinUrl(){
  const local = /^(localhost|127\.|\[::1\])/.test(location.hostname);
  const base = local && V.urls.length ? V.urls[0] : location.origin;
  return base + "/?r=" + V.code;
}
function qrImg(text, cell){
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const i = new Image(); i.src = q.createDataURL(cell || 8, 2); i.alt = "QR-Code zum Beitreten"; return i;
}
function flash(msg){ const p = el("p", "err", msg); $("stage").prepend(p); setTimeout(() => p.remove(), 4000); }

/* Hintergrundmusik: nur hier am Host, in Dauerschleife. Browser erlauben Ton erst nach dem ersten Klick. */
const music = new Audio("/music.mp3"); music.loop = true; music.volume = 0.35; music.preload = "none";
let musicOn = store.get("spieleabend-music") !== false;
function setMusic(on){
  musicOn = on; store.set("spieleabend-music", on);
  if (on) music.play().catch(() => {}); else music.pause();
  if (V) render();
}
if (musicOn){
  music.play().catch(() => {
    const go = () => { if (musicOn) music.play().catch(() => {}); };
    document.addEventListener("pointerdown", go, { once:true }); document.addEventListener("keydown", go, { once:true });
  });
}

async function boot(){
  if (!H){
    try { H = await post("create", { seen:store.get("spieleabend-seen") || [] }); store.set("spieleabend-host", H); }
    catch(e){ $("conn").textContent = "Server nicht erreichbar, neuer Versuch …"; $("conn").classList.add("off"); setTimeout(boot, 3000); return; }
  }
  if (sse) sse.close();
  sse = connect({ room:H.room, host:H.hostToken }, v => {
    if (!v.host){ roomGone(); return; }
    V = v; render();
  }, ok => { $("conn").textContent = ok ? "" : "Verbindung weg …"; $("conn").classList.toggle("off", !ok); },
  (t, d) => { if (t === "seen") updateSeen(d); else if (t === "draw") board.add(d); else board.sync(d); },
  roomGone);
}
// Raum ist weg (z. B. Server neu gestartet): ohne Neuladen sofort einen neuen Raum anlegen, die Musik läuft weiter
let newRoomNote = "", restarting = false;   // Hinweis bleibt in der Lobby, bis das nächste Spiel startet
function roomGone(){
  if (restarting) return; restarting = true;
  if (sse) sse.close();
  store.del("spieleabend-host"); H = null; confirmEnd = false; lastPhase = "";
  newRoomNote = "Der alte Raum war weg, z. B. weil der Server neu gestartet wurde. Hier ist ein neuer: bitte alle nochmal scannen.";
  boot().finally(() => { restarting = false; });
}


/* ---------- Stadt-Land-Fluss ---------- */
function renderSlf(st){
  st.appendChild(el("p", "eyebrow", "Stadt-Land-Fluss, Runde " + (V.round + 1) + " von " + V.rounds));
  if (V.phase === "write"){
    const top = el("div", "slf-top");
    top.append(el("div", "slf-letter", V.letter));
    const cats = el("div", "slf-cats"); V.cats.forEach(c => cats.appendChild(el("span", "slf-cat", c))); top.appendChild(cats);
    st.appendChild(top);
    st.append(countdown(V.endAt), timebar(V.endAt, 120));
    const pr = el("div", "chips");
    V.prog.forEach((p, i) => { const c = el("span", "chip" + (p.ok === V.cats.length ? " done" : "") + (p.online ? "" : " off"), p.name + " " + p.ok + "/" + V.cats.length);
      c.style.setProperty("--c", PC[i % PC.length]); pr.appendChild(c); });
    st.appendChild(pr);
    st.appendChild(el("p", "muted", "Wer als Erstes alle " + V.cats.length + " Kategorien richtig hat, stoppt die Runde für alle." + (V.ai && V.ai.enabled && V.ai.on ? " Die KI prüft jede Antwort." : "")));
    const b = el("button", "btn", "Runde jetzt stoppen"); b.onclick = () => host("slfStop"); st.appendChild(b);
    return;
  }
  if (V.phase === "review"){
    st.classList.add("top");
    const v = el("p", "verdict"); v.append("Buchstabe " + V.letter + ": ", V.stopBy ? V.stopBy + " hat gestoppt!" : "Zeit um!"); st.appendChild(v);
    if (V.comment) st.appendChild(aiLine(V.comment));
    const t = el("div", "slf-table");
    V.cats.forEach((cat, ci) => {
      const row = el("div", "slf-row"); row.appendChild(el("div", "slf-rowcat", cat));
      const cells = el("div", "slf-cells");
      V.table[ci].forEach((x, pi) => {
        if (x.st === "empty"){ const c = el("span", "slf-ans empty", x.name + ": –"); cells.appendChild(c); return; }
        const c = el("button", "slf-ans " + x.st); c.style.setProperty("--c", PC[pi % PC.length]);
        c.title = x.st === "ok" ? "Klicken, um zu streichen" : "Klicken, um gelten zu lassen";
        c.append(el("b", null, x.name + ": "), x.t, el("span", "pts", x.st === "ok" ? " +" + x.pts : x.st === "pend" ? " …" : " ✗"));
        if (x.st === "bad" && x.hint) c.appendChild(el("small", null, x.hint));
        c.onclick = () => host("slfToggle", { id:x.id, ci });
        cells.appendChild(c);
      });
      row.appendChild(cells); t.appendChild(row);
    });
    st.appendChild(t);
    st.appendChild(el("p", "muted", "Einzige gültige Antwort 20, eigene 10, doppelte 5. Antwort anklicken, um ein Urteil umzudrehen."));
    const n = el("button", "big", V.round + 1 >= V.rounds ? "Zum Ergebnis" : "Nächste Runde"); n.onclick = () => host("next"); st.appendChild(n);
  }
}
function updateSeen(d){
  const set = new Set(store.get("spieleabend-seen") || []);
  (d.del || []).forEach(h => set.delete(h)); (d.add || []).forEach(h => set.add(h));
  store.set("spieleabend-seen", [...set].slice(-15000));
}

/* ---------- Render ---------- */
function render(){
  const ae = document.activeElement, fid = ae && ae.tagName === "INPUT" ? ae.id : null, fval = fid ? ae.value : null;
  _render();
  if (fid && $(fid)){ $(fid).value = fval; $(fid).focus(); }
}
function _render(){
  $("code").textContent = V.code;
  const inGame = !!V.game;
  const mq = $("miniqr"); mq.hidden = !inGame; mq.innerHTML = "";
  if (inGame){ const d = el("div", "q"); d.appendChild(qrImg(joinUrl(), 3)); mq.append(d, el("span", null, "Später dazukommen? Scannen.")); }
  const tb = $("topBtns"); tb.innerHTML = "";
  if (inGame && V.phase !== "end"){
    if (!confirmEnd){ const b = el("button", "btn", "Spiel beenden"); b.onclick = () => { confirmEnd = true; render(); }; tb.appendChild(b); }
    else {
      const w = el("span", "confirm"); w.append(el("span", "muted", "Wirklich beenden?"));
      const y = el("button", "btn", "Ja, Ergebnis zeigen"); y.onclick = () => { confirmEnd = false; host("finish"); };
      const n = el("button", "btn", "Weiterspielen"); n.onclick = () => { confirmEnd = false; render(); };
      w.append(y, n); tb.appendChild(w);
    }
  }
  const mb = el("button", "btn music", musicOn ? "Musik an" : "Musik aus"); mb.setAttribute("aria-pressed", musicOn);
  mb.title = "Hintergrundmusik ein- oder ausschalten"; mb.onclick = () => setMusic(!musicOn); tb.appendChild(mb);
  if (V.ai){

function renderScores(){
  const s = $("scores"); s.innerHTML = "";
  if (!V.game) return;
  if (V.game === "slf"){
    const list = V.prog.map((p, i) => ({ ...p, c:PC[i % PC.length], score:(V.scores[p.id] || 0) + (V.roundPts ? V.roundPts[p.id] || 0 : 0) })).sort((a, b) => b.score - a.score);
    list.forEach((p, i) => { const d = el("div", "sc"); d.style.setProperty("--c", p.c); d.append(el("span", "n", (i + 1) + ". " + p.name), el("span", "p", p.score)); s.appendChild(d); });
    return;
  }
  if (V.game === "sch" && V.mode === "solo"){
    const list = V.guesses.map(p => ({ ...p, score:V.scores[p.id] || 0 })).sort((a,b) => b.score - a.score);
    list.forEach((p, i) => { const d = el("div", "sc"); d.style.setProperty("--c", PC[V.guesses.findIndex(x => x.id === p.id) % PC.length]);
      d.append(el("span", "n", (i+1) + ". " + p.name), el("span", "p", p.score)); s.appendChild(d); });
    return;

/* ---------- Schätz-Duell ---------- */
function schColor(p){ return V.mode === "team" ? TC(p.team) : PC[V.guesses.findIndex(x => x.id === p.id) % PC.length]; }
function renderSch(st){
  const Q = V.q;
  const ey = el("p", "eyebrow"); ey.append(Q.cat + " · Frage "); ey.appendChild(el("b", null, (V.round+1) + " / " + V.total)); st.appendChild(ey);
  st.appendChild(el("p", "hq", Q.text));
  if (V.phase === "guess"){
    if (V.endAt) st.append(countdown(V.endAt), timebar(V.endAt, V.time));
    const chips = el("div", "chips");
    V.guesses.forEach(p => { const c = el("span", "chip " + (p.submitted ? "done" : ""), p.name + (p.submitted ? " ✓" : " …")); c.style.setProperty("--c", schColor(p)); chips.appendChild(c); });
    st.appendChild(chips);
    const n = V.guesses.filter(p => !p.submitted).length;
    const b = el("button", "btn", n ? "Jetzt auflösen (" + n + " fehlen)" : "Auflösen"); b.onclick = () => host("reveal");
    st.appendChild(b);
    return;
  }
  const a = V.answer.value;

  st.appendChild(ans);
  const done = V.guesses.filter(p => p.value != null);
  if (done.length){ const tb = el("div", "tapebox"); tb.appendChild(tape(a, Q.year, done.map(p => ({ value:p.value, name:p.name, color:schColor(p) })))); st.appendChild(tb); }
  const gl = el("div", "glist");
  done.sort((x, y) => Math.abs(x.value - a) - Math.abs(y.value - a)).forEach(p => {
    const g = el("div", "g" + (p.pts ? " win" : "")); g.style.setProperty("--c", schColor(p));
    g.append(el("div", "w", p.name + (V.mode === "team" ? " · " + V.teams[p.team].name : "")), el("div", "v", Q.year ? String(p.value) : fmt(p.value)),
             el("div", "o", pct(p.value, a) + " daneben" + (p.pts ? " · +" + p.pts + (p.hit ? " Volltreffer!" : "") : "")));
    gl.appendChild(g);
  });
  st.appendChild(gl);
  const best = V.closest.map(id => V.guesses.find(p => p.id === id)).filter(Boolean);
  const vd = el("p", "verdict", !best.length ? "Keiner hat geschätzt" : best.map(p => p.name).join(" & ") + (best.length > 1 ? " sind gleich nah" : " holt den Punkt"));
  if (best.length === 1) vd.style.color = schColor(best[0]);
  st.appendChild(vd);

  const nb = el("button", "big", V.round + 1 >= V.total ? "Zum Ergebnis" : "Nächste Frage"); nb.onclick = () => host("next"); st.appendChild(nb);
}

function renderLeo(st){

  if (V.phase === "board"){
    const t = el("p", "eyebrow"); t.append("Am Zug: "); const b = el("b", null, tn(V.turn)); b.style.color = TC(V.turn); t.appendChild(b); t.append(" wählt am Handy ein Feld");

    V.board.cats.forEach(n => bd.appendChild(el("div", "cat", n)));

      const k = ci + "-" + row.lv, u = V.board.used[k];
      const tile = el("button", "tile", row.value);
      if (u !== undefined){ tile.disabled = true; if (u >= 0){ tile.classList.add("won"); tile.style.setProperty("--c", TC(u)); tile.textContent = tn(u); } }

    st.appendChild(w);
  }
  if (V.phase === "buzz"){
    st.appendChild(el("p", "verdict", c.wrongs.length ? "Andere Teams: jetzt buzzern!" : "Buzzer offen!"));
    st.append(countdown(V.endAt), timebar(V.endAt, c.wrongs.length ? 20 : 35));

    st.appendChild(ct);

  if (V.phase === "answer"){
    const v = el("p", "verdict"); const b = el("span", null, tn(c.buzzTeam)); b.style.color = TC(c.buzzTeam);
    v.append(b, " hat gebuzzert"); st.appendChild(v);
    if (V.input === "rufen"){
      st.appendChild(el("p", "hq", "Antwort laut sagen!"));
      st.append(countdown(V.endAt), timebar(V.endAt, c.answerSec));
      const ct = el("div", "ctrl");
      const y = el("button", "big", "Richtig"); y.style.setProperty("--c", "var(--ok)"); y.onclick = () => host("judge", { ok:true });
      const n = el("button", "big", "Falsch"); n.style.setProperty("--c", "var(--bad)"); n.onclick = () => host("judge", { ok:false });
      const pk = el("button", "btn", "Lösung gedrückt halten"); const sp = el("span", "muted");
      const on = e => { e.preventDefault(); sp.textContent = c.peek; }, off = () => { sp.textContent = ""; };
      pk.addEventListener("pointerdown", on); ["pointerup","pointerleave","pointercancel"].forEach(ev => pk.addEventListener(ev, off));
      ct.append(y, n, pk, sp); st.appendChild(ct);
    } else {
      st.appendChild(el("p", "muted", c.buzzName + " tippt die Antwort ein …"));
      st.append(countdown(V.endAt), timebar(V.endAt, c.answerSec));
    }
  }
  if (V.phase === "result"){
    const v = el("p", "verdict", c.ok ? "Richtig! +" + c.value + " für " + tn(c.winner) : "Keiner wusste es");
    v.style.color = c.ok ? TC(c.winner) : "var(--muted)"; st.appendChild(v);
    const a = el("p", "ans", c.answer); if (c.note) a.appendChild(el("small", null, c.note)); st.appendChild(a);
    const ct = el("div", "ctrl");
    const nx = el("button", "big", "Weiter "); nx.appendChild(countdown(V.endAt)); nx.onclick = () => host("next"); ct.appendChild(nx);
    if (c.ok){ const o = el("button", "btn", "Doch falsch werten"); o.onclick = () => host("override", { ok:false }); ct.appendChild(o); }
    else if (c.wrongs.some(w => !w.timeout)){ const o = el("button", "btn", "Letzte Antwort doch richtig"); o.onclick = () => host("override", { ok:true }); ct.appendChild(o); }
    st.appendChild(ct);
  }
}

    const sum = {}; got.forEach(x => sum[x.team] = (sum[x.team] || 0) + x.pts);
    const v = el("p", "verdict", got.length ? Object.entries(sum).map(([t, p]) => "+" + p + " für " + V.teams[t].name).join(", ") : "Kein Begriff erraten");
    if (Object.keys(sum).length === 1) v.style.color = TC(+Object.keys(sum)[0]); st.appendChild(v);
    const ch = el("div", "chips");
    V.words.forEach(x => { const c = el("span", "chip" + (x.team != null ? " done" : " off"), x.w + (x.team != null ? " +" + x.pts : x.open ? " (Zeit um)" : " (übersprungen)"));
      c.style.setProperty("--c", x.team != null ? TC(x.team) : "var(--muted)"); ch.appendChild(c); });
    st.appendChild(ch);
    const n = el("button", "big", "Nächstes Team"); n.onclick = () => host("next"); st.appendChild(n);
  }
}

/* ---------- Ende ---------- */
function renderEnd(st){
  const r = V.ranking || [];
  st.appendChild(el("p", "eyebrow", "Spielende"));
  const top = r.filter(x => x.score === r[0]?.score);
  st.appendChild(el("p", "huge", top.length > 1 ? "Unentschieden!" : (r[0]?.name || "–") + " gewinnt!"));
  const p = el("div", "podium");
  r.forEach((x, i) => { const d = el("div"); d.style.setProperty("--c", (V.game === "sch" && V.mode === "solo") || V.game === "slf" ? PC[i % PC.length] : TC(x.team));
    d.append(el("span", null, (i+1) + ". " + x.name), el("span", "num", x.score + " P")); p.appendChild(d); });
  st.appendChild(p);
  if (V.comment) st.appendChild(aiLine(V.comment));
  const b = el("button", "big", "Zurück zur Lobby"); b.onclick = () => host("lobby"); st.appendChild(b);
}

setInterval(() => fetch("/ping").catch(() => {}), 4 * 60 * 1000);   // Gratis-Hoster schlafen nach 15 Min. ohne Anfragen ein
boot().catch(e => { $("stage").innerHTML = ""; $("stage").appendChild(el("p", "err", "Server nicht erreichbar: " + e.message)); });
</script>
</body>
</html>
